<div class="mt-3">
    <div>
        <p>Item ID: {{itemTest.id}}</p>
        <p>Item Name: {{itemTest.name}}</p>
    </div>
    <div>
        <button class="button is-danger" (click)="onItemClick()">User {{itemTest.name}} Action!</button>
    </div>
    @if (isSelected) {
        <div>
            <p>✅ Is Selected</p>
        </div>
    } @else {
        <div>
            <p>❌ Not Selected</p>
        </div>
    }
</div>
