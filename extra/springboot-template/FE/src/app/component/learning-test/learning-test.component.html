<div class="mt-3">
    <h1>Test component</h1>
    <div>
        <img style="max-height: 200px;" [src]="imgPath" alt="test image" class="img-fluid">
    </div>
    <div>
        <p>{{textTest1()}}</p>
        <p>{{textTest2()}}</p>
        <button class="button is-primary mt-3" (click)="onTest1()">Detect Changes</button>
    </div>
    <div>
        <ul>
            @for (item of items; track item.id) {
                <li>
                    <app-item-test [id]="item.id" [name]="item.name" (itemClicked)="onItemClick($event)" />
                </li>
            }
        </ul>
    </div>
</div>
