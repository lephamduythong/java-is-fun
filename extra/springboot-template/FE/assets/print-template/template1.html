<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dữ Liệu Bảng</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .content-wrapper {
            background: white;
            padding: 20px;
        }
        h3 {
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 5px;
            text-align: center;
        }
        /* th {
            background-color: #f2f2f2;
        } */
        /* Điều khiển in ấn */
        .no-print {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 8px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        @media print {
            .no-print { display: none; }
            body { margin: 0; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <button onclick="window.print()">In bảng này</button>
    </div>

    <div class="content-wrapper">
        <p>Something: </p>
        <p>The following table: </p>

        <table>
            <thead>
                <tr>
                    <th>Tiêu đề 1</th>
                    <th>Tiêu đề 2</th>
                    <th>Tiêu đề 3</th>
                    <th>Tiêu đề 4</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{1}}</td>
                    <td>1 </td>
                    <td>6 </td>
                    <td>11 </td>
                </tr>
                <tr>
                    <td>B </td>
                    <td>2 </td>
                    <td>7 </td>
                    <td>12 </td>
                </tr>
                <tr>
                    <td>C </td>
                    <td>3 </td>
                    <td>8 </td>
                    <td>13 </td>
                </tr>
                <tr>
                    <td>X </td>
                    <td>4 </td>
                    <td>9 </td>
                    <td>14 </td>
                </tr>
                <tr>
                    <td>Y </td>
                    <td>5 </td>
                    <td>10 </td>
                    <td>165 </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
